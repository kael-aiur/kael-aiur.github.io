<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Multica 运行时调度流程</title>
  <desc id="desc">任务进入服务端队列后，WebSocket 唤醒和周期轮询触发 Daemon。Daemon 先获取并发槽位，再按 Runtime 认领任务。服务端原子检查 Runtime、Agent 并发和任务串行约束，随后 Daemon 准备工作目录并启动 Agent CLI，最后持续上报消息、用量和执行结果。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .lane { font-size: 16px; font-weight: 700; letter-spacing: 0.08em; }
      .title { font-size: 21px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 15px; fill: #475569; }
      .edge { font-size: 14px; font-weight: 600; fill: #475569; }
      .state { font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="610" rx="22" fill="url(#bg)"/>
  <text x="42" y="45" font-size="30" font-weight="750" fill="#0f172a">Multica 运行时调度流程</text>
  <text x="42" y="72" font-size="16" fill="#64748b">先占用本机执行能力，再认领服务端任务；数据库状态是调度事实来源</text>

  <rect x="36" y="96" width="1128" height="138" rx="18" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="54" y="113" width="92" height="28" rx="14" fill="#ede9fe"/>
  <text x="100" y="132" text-anchor="middle" class="lane" fill="#6d28d9">控制面</text>

  <g filter="url(#shadow)">
    <rect x="176" y="119" width="235" height="88" rx="15" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/>
    <rect x="490" y="119" width="235" height="88" rx="15" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.6"/>
    <rect x="804" y="119" width="270" height="88" rx="15" fill="#ecfeff" stroke="#22d3ee" stroke-width="1.6"/>
  </g>
  <text x="293" y="151" text-anchor="middle" class="title">任务写入队列</text>
  <text x="293" y="177" text-anchor="middle" class="body">agent_task_queue</text>
  <text x="293" y="196" text-anchor="middle" class="state" fill="#6d28d9">queued</text>
  <text x="607" y="151" text-anchor="middle" class="title">通知 Runtime</text>
  <text x="607" y="177" text-anchor="middle" class="body">WebSocket 快速唤醒</text>
  <text x="607" y="196" text-anchor="middle" class="body">周期轮询可靠兜底</text>
  <text x="939" y="151" text-anchor="middle" class="title">原子认领</text>
  <text x="939" y="177" text-anchor="middle" class="body">优先级 · Agent 并发 · 同上下文串行</text>
  <text x="939" y="196" text-anchor="middle" class="state" fill="#0e7490">queued → dispatched</text>
  <path d="M411 163 H480" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#arrow-violet)"/>

  <rect x="36" y="267" width="1128" height="145" rx="18" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <rect x="54" y="284" width="92" height="28" rx="14" fill="#ffedd5"/>
  <text x="100" y="303" text-anchor="middle" class="lane" fill="#c2410c">Daemon</text>

  <g filter="url(#shadow)">
    <rect x="176" y="291" width="235" height="94" rx="15" fill="#fff7ed" stroke="#fb923c" stroke-width="1.6"/>
    <rect x="490" y="291" width="235" height="94" rx="15" fill="#fff7ed" stroke="#fb923c" stroke-width="1.6"/>
    <rect x="804" y="291" width="270" height="94" rx="15" fill="#fff7ed" stroke="#fb923c" stroke-width="1.6"/>
  </g>
  <text x="293" y="324" text-anchor="middle" class="title">获取并发槽位</text>
  <text x="293" y="350" text-anchor="middle" class="body">整台机器共享容量</text>
  <text x="293" y="371" text-anchor="middle" class="body">满载时不认领任务</text>
  <text x="607" y="324" text-anchor="middle" class="title">按 Runtime 请求认领</text>
  <text x="607" y="350" text-anchor="middle" class="body">每个 Runtime 独立 Poller</text>
  <text x="607" y="371" text-anchor="middle" class="body">慢请求互不阻塞</text>
  <text x="939" y="324" text-anchor="middle" class="title">准备并启动执行</text>
  <text x="939" y="350" text-anchor="middle" class="body">本地目录锁（可选）· 工作目录</text>
  <text x="939" y="371" text-anchor="middle" class="state" fill="#c2410c">dispatched → running</text>
  <path d="M411 338 H480" fill="none" stroke="#ea580c" stroke-width="2.4" marker-end="url(#arrow-orange)"/>
  <path d="M725 338 H794" fill="none" stroke="#ea580c" stroke-width="2.4" marker-end="url(#arrow-orange)"/>
  <path d="M607 291 V225 C607 214 621 213 640 213 H916 C931 213 939 220 939 281" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#arrow-violet)"/>
  <text x="714" y="251" class="edge">占到槽位后才 Claim</text>

  <rect x="36" y="445" width="1128" height="128" rx="18" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  <rect x="54" y="462" width="92" height="28" rx="14" fill="#dcfce7"/>
  <text x="100" y="481" text-anchor="middle" class="lane" fill="#15803d">执行面</text>

  <g filter="url(#shadow)">
    <rect x="176" y="468" width="235" height="80" rx="15" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.6"/>
    <rect x="490" y="468" width="235" height="80" rx="15" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.6"/>
    <rect x="804" y="468" width="270" height="80" rx="15" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.6"/>
  </g>
  <text x="293" y="501" text-anchor="middle" class="title">Agent CLI 执行</text>
  <text x="293" y="527" text-anchor="middle" class="body">模型 · Shell · Git · MCP</text>
  <text x="607" y="501" text-anchor="middle" class="title">流式上报</text>
  <text x="607" y="527" text-anchor="middle" class="body">消息 · 工具调用 · Token 用量</text>
  <text x="939" y="501" text-anchor="middle" class="title">完成并释放槽位</text>
  <text x="939" y="527" text-anchor="middle" class="state" fill="#15803d">completed / failed / cancelled</text>
  <path d="M411 508 H480" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <path d="M725 508 H794" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <path d="M939 385 V458" fill="none" stroke="#ea580c" stroke-width="2.4" marker-end="url(#arrow-orange)"/>

  <text x="1140" y="594" text-anchor="end" font-size="12" fill="#94a3b8">无可用槽位时，任务继续留在 queued，不消耗派发超时</text>
</svg>
