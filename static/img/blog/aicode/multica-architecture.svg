<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Multica 分层架构</title>
  <desc id="desc">Multica 由交互层、控制面和执行面组成。客户端通过 HTTP 与 WebSocket 连接 Server，Server 使用 PostgreSQL 持久化数据，并调度本地 Daemon 启动 Agent CLI 调用模型和开发工具。</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .band-title { font-size: 17px; font-weight: 700; letter-spacing: 0.08em; }
      .node-title { font-size: 23px; font-weight: 700; fill: #0f172a; }
      .node-subtitle { font-size: 17px; fill: #475569; }
      .pill-text { font-size: 16px; font-weight: 600; fill: #334155; }
      .edge-label { font-size: 15px; font-weight: 600; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="22" fill="url(#background)"/>
  <text x="44" y="44" font-size="30" font-weight="750" fill="#0f172a">Multica 分层架构</text>
  <text x="44" y="70" font-size="17" fill="#64748b">Server 负责编排，Daemon 负责执行，Agent CLI 负责调用模型和工具</text>

  <!-- Interaction layer -->
  <rect x="40" y="90" width="1120" height="136" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <rect x="58" y="108" width="82" height="28" rx="14" fill="#dbeafe"/>
  <text x="99" y="127" text-anchor="middle" class="band-title" fill="#1d4ed8">交互层</text>

  <g transform="translate(72 157)">
    <circle cx="22" cy="19" r="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="22" cy="14" r="5.5" fill="#2563eb"/>
    <path d="M12 29c1-7 5-10 10-10s9 3 10 10" fill="#2563eb"/>
    <text x="51" y="16" class="node-title" font-size="18">用户 / 团队</text>
    <text x="51" y="36" class="node-subtitle">创建、分配与跟踪任务</text>
  </g>

  <path d="M300 176 H350" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <g filter="url(#shadow)">
    <rect x="366" y="119" width="746" height="82" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  </g>
  <text x="392" y="147" class="node-title" fill="#1e3a8a">Multica 客户端</text>
  <text x="392" y="174" class="node-subtitle">协作入口与实时状态展示</text>

  <g>
    <rect x="654" y="136" width="92" height="38" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="700" y="160" text-anchor="middle" class="pill-text">Web</text>
    <rect x="756" y="136" width="104" height="38" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="808" y="160" text-anchor="middle" class="pill-text">Desktop</text>
    <rect x="870" y="136" width="96" height="38" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="918" y="160" text-anchor="middle" class="pill-text">Mobile</text>
    <rect x="976" y="136" width="104" height="38" rx="10" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="1028" y="160" text-anchor="middle" class="pill-text">CLI</text>
  </g>

  <!-- Client / server traffic -->
  <path d="M650 201 V277" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="662" y="246" class="edge-label" fill="#1d4ed8">HTTP API</text>
  <path d="M600 277 V201" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-violet)"/>
  <text x="489" y="246" class="edge-label" fill="#6d28d9">WebSocket 事件</text>

  <!-- Control plane -->
  <rect x="40" y="276" width="1120" height="194" rx="18" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.5"/>
  <rect x="58" y="294" width="82" height="28" rx="14" fill="#ede9fe"/>
  <text x="99" y="313" text-anchor="middle" class="band-title" fill="#6d28d9">控制面</text>

  <g filter="url(#shadow)">
    <rect x="176" y="306" width="650" height="130" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
  </g>
  <text x="202" y="339" class="node-title" fill="#5b21b6">Multica Server</text>
  <text x="202" y="362" class="node-subtitle">Go · Chi · sqlc · WebSocket Hub</text>
  <g>
    <rect x="202" y="383" width="132" height="32" rx="9" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="268" y="404" text-anchor="middle" class="pill-text">认证与权限</text>
    <rect x="344" y="383" width="132" height="32" rx="9" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="410" y="404" text-anchor="middle" class="pill-text">任务编排</text>
    <rect x="486" y="383" width="144" height="32" rx="9" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="558" y="404" text-anchor="middle" class="pill-text">Runtime 管理</text>
    <rect x="640" y="383" width="160" height="32" rx="9" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="720" y="404" text-anchor="middle" class="pill-text">实时事件 / 调度</text>
  </g>

  <path d="M826 371 H860" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-violet)"/>
  <text x="836" y="359" class="edge-label" fill="#6d28d9">读写</text>

  <g filter="url(#shadow)">
    <rect x="874" y="320" width="250" height="102" rx="16" fill="#ecfeff" stroke="#22d3ee" stroke-width="1.6"/>
  </g>
  <ellipse cx="930" cy="350" rx="32" ry="10" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
  <path d="M898 350v31c0 6 14 10 32 10s32-4 32-10v-31" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
  <path d="M898 365c0 6 14 10 32 10s32-4 32-10" fill="none" stroke="#0891b2" stroke-width="1.2"/>
  <text x="980" y="355" class="node-title" font-size="18">PostgreSQL</text>
  <text x="980" y="379" class="node-subtitle">任务 · 状态</text>
  <text x="980" y="399" class="node-subtitle">消息 · 会话</text>

  <!-- Execution plane -->
  <rect x="40" y="506" width="1120" height="176" rx="18" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <rect x="58" y="524" width="82" height="28" rx="14" fill="#ffedd5"/>
  <text x="99" y="543" text-anchor="middle" class="band-title" fill="#c2410c">执行面</text>

  <g filter="url(#shadow)">
    <rect x="170" y="540" width="220" height="104" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="1.7"/>
  </g>
  <text x="280" y="575" text-anchor="middle" class="node-title" fill="#9a3412">Multica Daemon</text>
  <text x="280" y="600" text-anchor="middle" class="node-subtitle">认领 · 心跳 · 并发控制</text>
  <text x="280" y="622" text-anchor="middle" class="node-subtitle">运行在执行机器上</text>

  <g filter="url(#shadow)">
    <rect x="448" y="540" width="202" height="104" rx="16" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.7"/>
  </g>
  <text x="549" y="575" text-anchor="middle" class="node-title" fill="#166534">任务执行环境</text>
  <text x="549" y="600" text-anchor="middle" class="node-subtitle">工作目录 · 上下文</text>
  <text x="549" y="622" text-anchor="middle" class="node-subtitle">Skill · 配置 · 凭证</text>

  <g filter="url(#shadow)">
    <rect x="708" y="540" width="202" height="104" rx="16" fill="#fef2f2" stroke="#fb7185" stroke-width="1.7"/>
  </g>
  <text x="809" y="575" text-anchor="middle" class="node-title" fill="#9f1239">Agent CLI</text>
  <text x="809" y="600" text-anchor="middle" class="node-subtitle">Claude Code · Codex</text>
  <text x="809" y="622" text-anchor="middle" class="node-subtitle">及其他 Provider</text>

  <g filter="url(#shadow)">
    <rect x="968" y="540" width="152" height="104" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.7"/>
  </g>
  <text x="1044" y="575" text-anchor="middle" class="node-title" font-size="18">外部能力</text>
  <text x="1044" y="600" text-anchor="middle" class="node-subtitle">模型服务</text>
  <text x="1044" y="622" text-anchor="middle" class="node-subtitle">Shell · Git · MCP</text>

  <!-- Execution flow -->
  <path d="M390 592 H438" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <path d="M650 592 H698" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <path d="M910 592 H958" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrow-orange)"/>

  <!-- Server / daemon connection -->
  <path d="M300 436 C300 470 280 486 280 530" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-violet)"/>
  <path d="M244 540 C244 487 258 474 264 436" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-orange)"/>
  <rect x="303" y="466" width="190" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="398" y="484" text-anchor="middle" class="edge-label">唤醒 / 认领 / 心跳 / 上报</text>

  <text x="1138" y="703" text-anchor="end" font-size="12" fill="#94a3b8">控制面不直接调用模型</text>
</svg>
