# Site configuration
theme: jekyll-theme-chirpy

lang: zh-CN
timezone: Asia/Shanghai

title: 九千万代码的梦想
tagline: Kael 的个人技术博客
description: >-
  Kael 的个人技术博客，记录 AI 编程、Java、云原生、基础设施和开发工具等技术实践。

url: "https://kael-aiur.com"
baseurl: ""

# Preserve every historical article URL while changing the theme.
permalink: /:categories/:title.html

github:
  username: kael-aiur

social:
  name: Kael
  email: kael.peng@gmail.com
  links:
    - https://github.com/kael-aiur

webmaster_verifications:
  baidu: code-5K59wbb9as

analytics:
  google:
    id:

pageviews:
  provider:

# Empty means following the reader's system preference. The sidebar switch
# can still force light or dark mode.
theme_mode:

cdn:
avatar: /static/img/title.png
social_preview_image:

toc: true

actions:
  edit_post:
    enabled: true
    url: "https://github.com/kael-aiur/kael-aiur.github.io/edit/master"
    static_url: false

comments:
  provider:

assets:
  self_host:
    enabled: false

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
  - IFLOW.md
  - keystore
